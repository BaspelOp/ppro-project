services:
  db:
    image: postgres:16-alpine
    container_name: ppro_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppro_equipment
      POSTGRES_USER: ppro_user
      POSTGRES_PASSWORD: ppro_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHEVAL", "pg_isready -U ppro_user -d ppro_equipment"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ppro_fastapi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ppro_user:ppro_secret@db:5432/ppro_equipment
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ppro_react_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
